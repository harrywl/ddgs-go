name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / go${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt check
        if: runner.os != 'Windows'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Build binaries
        run: |
          go build ./...
          go build -o bin/ ./cmd/ddgs ./cmd/ddgs-api ./cmd/ddgs-mcp

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race ./...

  integration:
    name: integration (live network)
    runs-on: ubuntu-latest
    # Live-engine tests are inherently flaky (rate limits, HTML changes).
    # They run on main pushes only and are allowed to fail without blocking.
    continue-on-error: true
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Integration tests
        run: go test -tags=integration -timeout 10m ./...
